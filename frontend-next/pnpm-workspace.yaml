minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true
verifyDepsBeforeRun: false

packages:
  - 'packages/*'

# 本地联调 XiHan.UI 的 next 线：在这里加 overrides 把 @xihan-ui/* 指到同级 E:/Repository/XiHanFun/XiHan.UI 的源码（见 README），
# overrides 不提交；CI 与常规开发用 catalog 里的发布版。

allowBuilds:
  core-js: true
  vue-demi: true

# 依赖目录（单一版本事实源）：入口包与 packages/* 一律 catalog: 引用，升级只改这里一处
catalog:
  '@antfu/eslint-config': ^9.5.1
  '@iconify-json/carbon': ^1.2.28
  '@iconify-json/ep': ^1.2.4
  '@iconify-json/heroicons': ^1.2.3
  '@iconify-json/lucide': ^1.2.144
  '@iconify-json/mdi': ^1.2.3
  '@iconify-json/simple-icons': ^1.2.100
  '@iconify-json/tabler': ^1.2.42
  '@iconify/vue': ^5.0.3
  '@microsoft/signalr': ^10.0.11
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^26.6.5
  '@types/papaparse': ^5.5.2
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/test-utils': ^2.5.1
  '@vueuse/core': ^15.0.0
  '@xihan-ui/code-highlight': ^5.1.0
  '@xihan-ui/core': ^5.1.0
  '@xihan-ui/headless': ^5.1.0
  '@xihan-ui/icons': ^5.1.0
  '@xihan-ui/markdown': ^5.1.0
  '@xihan-ui/motion': ^5.1.0
  '@xihan-ui/sound': ^5.1.0
  '@xihan-ui/styles': ^5.1.0
  '@xihan-ui/tokens': ^5.1.0
  '@xihan-ui/vue': ^5.1.0
  cross-env: ^10.1.0
  dayjs: ^1.11.23
  eslint: ^10.12.0
  eslint-plugin-format: ^2.0.1
  jsdom: ^30.1.2
  md-editor-v3: ^7.1.0
  openapi-typescript: ^7.13.0
  oxlint: ^1.88.0
  papaparse: ^5.7.0
  pinia: ^4.0.3
  pinyin-pro: ^3.29.5
  prettier: ^3.9.10
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  unplugin-vue-components: ^32.1.0
  vite: ^8.3.4
  vitest: ^5.0.4
  vue: ^3.5.44
  vue-i18n: ^11.4.14
  vue-router: ^5.4.0
  # 钉在 3.3.11：3.3.12 起把模板事件处理函数里导入对象的成员访问误补成 .value（vuejs/language-tools#6237），上游修复发版后恢复 ^ 范围
  vue-tsc: 3.3.11
