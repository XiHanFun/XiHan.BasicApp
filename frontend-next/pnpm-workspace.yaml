minimumReleaseAgeExcludePrune: true
# pnpm 对刚发布的包有最短发布时长闸门，升级时由它自己登记当时刚发布的版本；锁文件不再解析到的条目由 minimumReleaseAgeExcludePrune 在之后的 add / update / remove 时清掉
minimumReleaseAgeExclude:
  - '@xihan-ui/code-highlight@5.4.0'
  - '@xihan-ui/core@5.4.0'
  - '@xihan-ui/designer-kit@5.4.0'
  - '@xihan-ui/designer-shell@5.4.0'
  - '@xihan-ui/expression@5.4.0'
  - '@xihan-ui/headless@5.4.0'
  - '@xihan-ui/icons@5.4.0'
  - '@xihan-ui/markdown@5.4.0'
  - '@xihan-ui/motion@5.4.0'
  - '@xihan-ui/pointer@5.4.0'
  - '@xihan-ui/position@5.4.0'
  - '@xihan-ui/sound@5.4.0'
  - '@xihan-ui/styles@5.4.0'
  - '@xihan-ui/tokens@5.4.0'
  - '@xihan-ui/viz@5.4.0'
  - '@xihan-ui/vue@5.4.0'
  - '@xihan-ui/web-components@5.4.0'

trustPolicy: no-downgrade
shellEmulator: true
verifyDepsBeforeRun: false

packages:
  - 'packages/*'

# 本地联调 XiHan.UI 未发布的改动：在这里加 overrides 把 @xihan-ui/* 指到同级 E:/Repository/XiHanFun/XiHan.UI 的源码（见 README），
# overrides 不提交；CI 与常规开发用 catalog 里的发布版。

allowBuilds:
  core-js: true
  vue-demi: true

# 依赖目录（单一版本事实源）：入口包与 packages/* 一律 catalog: 引用，升级只改这里一处
