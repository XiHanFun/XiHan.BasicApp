# XiHan.BasicApp 一键启动：PostgreSQL + 后端 + 前端（Nginx 托管并同源反代后端）
#
# 用法：cp .env.example .env，按需改密码与密钥，然后 docker compose up -d --build
# - 构建后端镜像时按 backend/props/framework.props 的版本从 NuGet 还原 XiHan.Framework，需要能访问 nuget.org
# - init 服务先执行表结构升级与种子（可重复执行，每次 up 都会跑一遍），完成后后端才启动
# - 前端 http://localhost:${FRONTEND_PORT}，用 superadmin 与 .env 里的 SUPERADMIN_PASSWORD 登录，登录后立即修改密码
# - 单实例零外部依赖：缓存与消息走进程内实现；要 Redis、RabbitMQ、Qdrant 时打开文末注释掉的服务
# 完整配置项见 backend/src/XiHan.BasicApp.Host/appsettings.json，部署要点见 docs/deployment.md

name: xihan-basicapp

# 后端与 init 共用的环境变量（键名与 appsettings.json 一一对应，双下划线分节）
x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: Production
  # 平台库连接（启动硬要求）
  XiHan__Bindings__db__type: connection:relational
  XiHan__Bindings__db__provider: postgresql
  XiHan__Bindings__db__value: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  # 密钥：UTF-8 至少 32 字节，缺失或太短启动即失败
  XiHan__Security__Jwt__Secret: ${JWT_SECRET}
  XiHan__ObjectStorage__SignedUrls__Secret: ${SIGNED_URLS_SECRET}
  # 种子：superadmin 的初始密码（只在首次写入时使用）与是否写演示数据
  BasicApp__Seed__SuperAdminPassword: ${SUPERADMIN_PASSWORD}
  BasicApp__Seed__EnableDemoData: ${ENABLE_DEMO_DATA:-false}
  # 只信本网络里的 Nginx 转发头，访问日志、登录地点与访问策略才拿得到客户端地址
  BasicApp__ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
  # Redis（打开下面的 redis 服务后取消注释）
  # XiHan__Bindings__cache__type: cache:distributed
  # XiHan__Bindings__cache__value: redis:6379
  # RabbitMQ（打开下面的 rabbitmq 服务后取消注释）
  # XiHan__Bindings__queue__type: queue
  # XiHan__Bindings__queue__value: amqp://guest:guest@rabbitmq:5672
  # Qdrant 向量库（AI 知识库；打开下面的 qdrant 服务后取消注释）
  # BasicApp__AI__Qdrant__Host: qdrant

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - basicapp

  # 表结构升级与种子：执行完即退出，后端等它成功后再启动
  init:
    build: ./backend
    image: xihan-basicapp-backend:local
    entrypoint: ["/bin/sh", "-c", "dotnet XiHan.BasicApp.Host.dll schema upgrade && dotnet XiHan.BasicApp.Host.dll seed"]
    environment: *backend-env
    volumes:
      # 与后端共用数据卷：种子加密写入的值要用同一套数据保护密钥解开
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - basicapp

  backend:
    # 与 init 同一个镜像（第二次构建全部命中缓存）
    build: ./backend
    image: xihan-basicapp-backend:local
    environment: *backend-env
    volumes:
      # 文件存储、数据保护密钥与框架缺省的文件系统存储
      - backend-data:/app/data
    ports:
      # 直接调用接口时用；浏览器经前端同源访问，不需要这个端口
      - "${BACKEND_PORT:-9710}:9710"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - basicapp

  frontend:
    build: ./frontend
    image: xihan-basicapp-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - basicapp

  # 可选：Redis 共享缓存与两级缓存（多实例部署时需要）
  # redis:
  #   image: redis:8-alpine
  #   restart: unless-stopped
  #   networks:
  #     - basicapp

  # 可选：RabbitMQ 消息代理（发件箱派发、广播订阅经它）
  # rabbitmq:
  #   image: rabbitmq:4-alpine
  #   restart: unless-stopped
  #   networks:
  #     - basicapp

  # 可选：Qdrant 向量库（AI 知识库）
  # qdrant:
  #   image: qdrant/qdrant:v1.15.1
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   restart: unless-stopped
  #   networks:
  #     - basicapp

networks:
  basicapp:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  backend-data:
  # qdrant-data:
