name: CI

# 后端（backend）与前端（frontend）的构建、测试与门禁。后端按 backend/props/framework.props 的版本还原 XiHan.Framework 的 NuGet 包，不检出框架源码。
on:
  push:
    branches: [main, dev, preview]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main, dev, preview]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # 发布分支（preview、main）上每个提交都要跑出完整结论，发版时以它为据
  cancel-in-progress: ${{ github.ref != 'refs/heads/preview' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: 后端构建、测试与架构门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 宿主配了连接才装的 Redis 与 RabbitMQ：DistributedProvidersTests 读 XIHAN_TEST_REDIS / XIHAN_TEST_RABBITMQ，没设即跳过
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: 检出 BasicApp
        uses: actions/checkout@v7
        with:
          path: XiHan.BasicApp

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore XiHan.BasicApp/backend/XiHan.BasicApp.slnx

      - name: 构建（警告即错误）
        run: dotnet build XiHan.BasicApp/backend/XiHan.BasicApp.slnx -c Release --no-restore

      # MTP 模式：解决方案由 --solution 传入。两库冒烟对真实 PostgreSQL 跑（XIHAN_TEST_POSTGRES 未设置时跳过）
      # 选 MTP 的 global.json 在 BasicApp 仓库根，dotnet 从工作目录往上找它：必须在 XiHan.BasicApp 里执行，否则退回 VSTest 不认 --solution
      # 报告用 xUnit v3 自带的 --report-xunit-trx（落在 XiHan.BasicApp/TestResults）；测试工程没引用 TRX 扩展，--report-trx 是无效参数（退出码 5，零个测试）
      - name: 测试
        working-directory: XiHan.BasicApp
        env:
          XIHAN_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres
          XIHAN_TEST_REDIS: 127.0.0.1:6379
          XIHAN_TEST_RABBITMQ: amqp://guest:guest@127.0.0.1:5672
        run: dotnet test --solution backend/XiHan.BasicApp.slnx -c Release --no-build -- --report-xunit-trx

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: 'XiHan.BasicApp/**/TestResults/*.trx'
          if-no-files-found: ignore

  # 集成测试整套换一种库跑：XIHAN_TEST_DB 选库，每个用例在该库上建临时库（Oracle 是临时用户）
  # 库用 docker run 起，不用 services：services 传不了启动参数，测试库要关掉刷盘，否则 MySQL 每个用例建表要几十秒
  # 每种库分 3 片并行：每个用例都在新库上起宿主（SQL Server 上一次约 15 秒），一片只跑分到的测试类，各片自己起库、互不相干
  backend-databases:
    name: 集成测试（${{ matrix.db }} ${{ matrix.shard }}/3）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql, sqlserver]
        # 改片数要同时改下面的 SHARDS 与作业名里的 /3
        shard: [1, 2, 3]
    env:
      DB_PASSWORD: XiHan_Test_2026
      SHARDS: 3
    steps:
      - name: 检出 BasicApp
        uses: actions/checkout@v7
        with:
          path: XiHan.BasicApp

      - name: 启动数据库
        run: |
          case "${{ matrix.db }}" in
            postgresql)
              docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD="$DB_PASSWORD" postgres:17-alpine \
                -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=500
              echo "XIHAN_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres;Password=$DB_PASSWORD" >> "$GITHUB_ENV"
              ready() { docker exec db pg_isready -U postgres; } ;;
            mysql)
              docker run -d --name db -p 3306:3306 -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.4 \
                --max-connections=1000 --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --skip-log-bin --innodb-doublewrite=OFF
              echo "XIHAN_TEST_MYSQL=Server=127.0.0.1;Port=3306;User ID=root;Password=$DB_PASSWORD" >> "$GITHUB_ENV"
              ready() { docker exec db mysql -uroot -p"$DB_PASSWORD" -e "SELECT 1"; } ;;
            sqlserver)
              docker run -d --name db -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$DB_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
              echo "XIHAN_TEST_SQLSERVER=Server=127.0.0.1,1433;User ID=sa;Password=$DB_PASSWORD;TrustServerCertificate=True;Encrypt=False" >> "$GITHUB_ENV"
              ready() { docker exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1"; } ;;
            oracle)
              docker run -d --name db -p 1521:1521 -e ORACLE_PASSWORD="$DB_PASSWORD" gvenzl/oracle-free:23-slim-faststart
              echo "XIHAN_TEST_ORACLE=Data Source=127.0.0.1:1521/FREEPDB1;User Id=system;Password=$DB_PASSWORD" >> "$GITHUB_ENV"
              ready() { docker exec db healthcheck.sh; } ;;
          esac
          for attempt in $(seq 1 60); do
            if ready > /dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          docker logs db
          exit 1

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 构建
        run: dotnet build XiHan.BasicApp/backend/test/XiHan.BasicApp.Integration.Tests -c Release

      # 按类分片：列出全部测试方法，按用例数均衡分到各片（.github/scripts/test-shard.mjs），这一片的类写进 classes.txt
      - name: 分片
        working-directory: XiHan.BasicApp
        run: |
          dotnet backend/test/XiHan.BasicApp.Integration.Tests/bin/Release/net10.0/XiHan.BasicApp.Integration.Tests.dll -list methods/json > "$RUNNER_TEMP/methods.json"
          node .github/scripts/test-shard.mjs "$RUNNER_TEMP/methods.json" "${{ matrix.shard }}" "$SHARDS" > "$RUNNER_TEMP/classes.txt"

      - name: 集成测试
        working-directory: XiHan.BasicApp
        env:
          XIHAN_TEST_DB: ${{ matrix.db }}
        # 类全名里没有空白，按行展开成 --filter-class 的多个值（多个之间是或）
        run: dotnet test --project backend/test/XiHan.BasicApp.Integration.Tests -c Release --no-build -- --max-threads 4 --report-xunit-trx --filter-class $(cat "$RUNNER_TEMP/classes.txt")

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ matrix.db }}-${{ matrix.shard }}
          path: 'XiHan.BasicApp/**/TestResults/*.trx'
          if-no-files-found: ignore

  contracts:
    name: 契约漂移门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出 BasicApp
        uses: actions/checkout@v7
        with:
          path: XiHan.BasicApp

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: XiHan.BasicApp/frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 后端导出的 openapi.json 必须与入库的一致；再由它重新生成契约层，diff 也须为空。
      # dotnet run 以工程目录为工作目录，--out 必须给绝对路径
      - name: 导出接口文档并比对
        run: |
          dotnet run --project XiHan.BasicApp/backend/src/XiHan.BasicApp.Host/XiHan.BasicApp.Host.csproj -c Release -- contracts export --out "$GITHUB_WORKSPACE/XiHan.BasicApp/frontend/contracts"
          git -C XiHan.BasicApp diff --exit-code -- frontend/contracts

      - name: 安装前端依赖
        working-directory: XiHan.BasicApp/frontend
        run: pnpm install --no-frozen-lockfile

      - name: 重新生成契约层并比对
        working-directory: XiHan.BasicApp/frontend
        run: pnpm run contracts:check

  frontend:
    name: 前端门禁、单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 没有锁文件
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # type-check → lint → px → token → i18n → modules → tests → headers → contracts → permissions
      - name: 门禁
        run: pnpm run check

      - name: 单测
        run: pnpm run test

      - name: 生产构建
        run: pnpm run build

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 宿主以 Development 环境启动：建库 xihan_basicapp_e2e、建表、播种，凭据与 e2e/env.ts 的缺省连接串一致
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # 用例里 dotnet run 只做增量检查，先在这里构建好宿主
      - name: 构建宿主
        run: dotnet build ../backend/src/XiHan.BasicApp.Host/XiHan.BasicApp.Host.csproj -c Release

      # playwright.config.ts 自起后端（9730）与前端生产构建的预览（9130），种子跑完才开始
      - name: 端到端用例
        run: pnpm run e2e

      - name: 上传报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
