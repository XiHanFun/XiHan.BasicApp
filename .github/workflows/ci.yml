name: CI

# 后端（backend）与前端（frontend）的构建、测试与门禁。后端按 backend/props/framework.props 的版本还原 XiHan.Framework 的 NuGet 包，不检出框架源码。
on:
  push:
    branches: [main, dev, preview]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev, preview]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # 发布分支（preview、main）上每个提交都要跑出完整结论，发版时以它为据
  cancel-in-progress: ${{ github.ref != 'refs/heads/preview' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: 后端构建、测试与架构门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 宿主配了连接才装的 Redis 与 RabbitMQ：DistributedProvidersTests 读 XIHAN_TEST_REDIS / XIHAN_TEST_RABBITMQ，没设即跳过
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: 检出 BasicApp
        uses: actions/checkout@v7
        with:
          path: XiHan.BasicApp

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore XiHan.BasicApp/backend/XiHan.BasicApp.slnx

      - name: 构建（警告即错误）
        run: dotnet build XiHan.BasicApp/backend/XiHan.BasicApp.slnx -c Release --no-restore

      # MTP 模式：解决方案由 --solution 传入。两库冒烟对真实 PostgreSQL 跑（XIHAN_TEST_POSTGRES 未设置时跳过）
      # 选 MTP 的 global.json 在 BasicApp 仓库根，dotnet 从工作目录往上找它：必须在 XiHan.BasicApp 里执行，否则退回 VSTest 不认 --solution
      # 报告用 xUnit v3 自带的 --report-xunit-trx（落在 XiHan.BasicApp/TestResults）；测试工程没引用 TRX 扩展，--report-trx 是无效参数（退出码 5，零个测试）
      - name: 测试
        working-directory: XiHan.BasicApp
        env:
          XIHAN_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres
          XIHAN_TEST_REDIS: 127.0.0.1:6379
          XIHAN_TEST_RABBITMQ: amqp://guest:guest@127.0.0.1:5672
        run: dotnet test --solution backend/XiHan.BasicApp.slnx -c Release --no-build -- --report-xunit-trx

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: 'XiHan.BasicApp/**/TestResults/*.trx'
          if-no-files-found: ignore

  contracts:
    name: 契约漂移门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出 BasicApp
        uses: actions/checkout@v7
        with:
          path: XiHan.BasicApp

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: XiHan.BasicApp/frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 后端导出的 openapi.json 必须与入库的一致；再由它重新生成契约层，diff 也须为空。
      # dotnet run 以工程目录为工作目录，--out 必须给绝对路径
      - name: 导出接口文档并比对
        run: |
          dotnet run --project XiHan.BasicApp/backend/src/XiHan.BasicApp.Host/XiHan.BasicApp.Host.csproj -c Release -- contracts export --out "$GITHUB_WORKSPACE/XiHan.BasicApp/frontend/contracts"
          git -C XiHan.BasicApp diff --exit-code -- frontend/contracts

      - name: 安装前端依赖
        working-directory: XiHan.BasicApp/frontend
        run: pnpm install --no-frozen-lockfile

      - name: 重新生成契约层并比对
        working-directory: XiHan.BasicApp/frontend
        run: pnpm run contracts:check

  frontend:
    name: 前端门禁、单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 没有锁文件
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # type-check → lint → px → token → i18n → modules → tests → headers → contracts → permissions
      - name: 门禁
        run: pnpm run check

      - name: 单测
        run: pnpm run test

      - name: 生产构建
        run: pnpm run build

  e2e:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 宿主以 Development 环境启动：建库 xihan_basicapp_e2e、建表、播种，凭据与 e2e/env.ts 的缺省连接串一致
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # 用例里 dotnet run 只做增量检查，先在这里构建好宿主
      - name: 构建宿主
        run: dotnet build ../backend/src/XiHan.BasicApp.Host/XiHan.BasicApp.Host.csproj -c Release

      # playwright.config.ts 自起后端（9730）与前端生产构建的预览（9130），种子跑完才开始
      - name: 端到端用例
        run: pnpm run e2e

      - name: 上传报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
