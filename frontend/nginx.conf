# 前端容器的 Nginx 配置：托管构建产物，并把后端路径反向代理到 compose 里的 backend 服务
# 与 docs/deployment.md 的示例同一套规则；client_max_body_size 与 BasicApp:Files:MaxUploadBytes（缺省 100 MB）一致

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 操作、文件、OAuth、Telegram Webhook
    location /api/ {
        proxy_pass http://backend:9710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # 本地存储的签名地址
    location /blobs/ {
        proxy_pass http://backend:9710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR（WebSocket）
    location /hubs/ {
        proxy_pass http://backend:9710;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health/ {
        proxy_pass http://backend:9710;
    }
}
