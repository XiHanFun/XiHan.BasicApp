# eslint-disable pnpm/yaml-enforce-settings -- 该规则要求补 trustPolicy: no-downgrade，
# 启用后 pnpm install 因 semver@6.3.1 的 trust downgrade 判定直接失败，需先处置该锁文件条目
allowBuilds:
  core-js: true
  vue-demi: true
verifyDepsBeforeRun: false

# pnpm 对刚发布不久的包有最短发布时长的默认闸门，装 @xihan-ui 那批时由它自动登记。
# 这批包过了时长门槛后本段即可删除；pnpm 会自己维护这里的条目。
minimumReleaseAgeExclude:
  - '@xihan-ui/behavior@1.1.0'
  - '@xihan-ui/code-highlight@1.1.0'
  - '@xihan-ui/headless@1.1.0'
  - '@xihan-ui/kernel@1.1.0'
  - '@xihan-ui/machine@1.1.0'
  - '@xihan-ui/motion@1.1.0'
  - '@xihan-ui/pointer@1.1.0'
  - '@xihan-ui/position@1.1.0'
  - '@xihan-ui/styles@1.1.0'
  - '@xihan-ui/tokens@1.1.0'
  - '@xihan-ui/vue@1.1.0'
packages:
  - 'packages/*'

