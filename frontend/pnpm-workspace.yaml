# eslint-disable pnpm/yaml-enforce-settings -- 该规则要求补 trustPolicy: no-downgrade，
# 启用后 pnpm install 因 semver@6.3.1 的 trust downgrade 判定直接失败，需先处置该锁文件条目
# pnpm 对刚发布不久的包有最短发布时长的默认闸门，升级依赖时由它自动登记当时刚发布的版本。
# 这些版本过了时长门槛后对应条目即可删除；pnpm 会自己维护这里的条目。
minimumReleaseAgeExclude:
  - '@xihan-ui/code-highlight@3.0.0'
  - '@xihan-ui/core@3.0.0'
  - '@xihan-ui/headless@3.0.0'
  - '@xihan-ui/motion@3.0.0'
  - '@xihan-ui/pointer@3.0.0'
  - '@xihan-ui/position@3.0.0'
  - '@xihan-ui/styles@3.0.0'
  - '@xihan-ui/tokens@3.0.0'
  - '@xihan-ui/vue@3.0.0'
  - '@xihan-ui/viz@3.0.0'
  - '@iconify-json/lucide@1.2.139'
  - '@intlify/core-base@11.4.13'
  - '@intlify/devtools-types@11.4.13'
  - '@intlify/message-compiler@11.4.13'
  - '@intlify/shared@11.4.13'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - turbo@2.11.7
  - vue-i18n@11.4.13

verifyDepsBeforeRun: false

packages:
  - 'packages/*'

# @antv/x6 3.x 的 es / lib 产物运行时 import tslib，但发布清单只把它放在 devDependencies；
# pnpm 严格隔离下解析不到，生产构建直接失败。上游清单补上后删掉本段
packageExtensions:
  '@antv/x6@3':
    dependencies:
      tslib: ^2.8.1

allowBuilds:
  core-js: true
  vue-demi: true
# 开发期临时：@xihan-ui/* 改指同级 XiHan.UI 源码，改库不用发版、应用立刻吃到。
# 缩放口径与响应式那批做完并发版之后，删掉本段即回落到 catalog 里的发布版。
# overrides:
#   '@xihan-ui/animations': 'link:../../XiHan.UI/ui/packages/features/animations'
#   '@xihan-ui/backgrounds': 'link:../../XiHan.UI/ui/packages/features/backgrounds'
#   '@xihan-ui/chat-stream': 'link:../../XiHan.UI/ui/packages/features/chat-stream'
#   '@xihan-ui/code-highlight': 'link:../../XiHan.UI/ui/packages/features/code-highlight'
#   '@xihan-ui/core': 'link:../../XiHan.UI/ui/packages/engine/core'
#   '@xihan-ui/headless': 'link:../../XiHan.UI/ui/packages/engine/headless'
#   '@xihan-ui/icons': 'link:../../XiHan.UI/ui/packages/design/icons'
#   '@xihan-ui/markdown': 'link:../../XiHan.UI/ui/packages/features/markdown'
#   '@xihan-ui/motion': 'link:../../XiHan.UI/ui/packages/engine/motion'
#   '@xihan-ui/pointer': 'link:../../XiHan.UI/ui/packages/engine/pointer'
#   '@xihan-ui/position': 'link:../../XiHan.UI/ui/packages/engine/position'
#   '@xihan-ui/sound': 'link:../../XiHan.UI/ui/packages/features/sound'
#   '@xihan-ui/styles': 'link:../../XiHan.UI/ui/packages/design/styles'
#   '@xihan-ui/tokens': 'link:../../XiHan.UI/ui/packages/design/tokens'
#   '@xihan-ui/vue': 'link:../../XiHan.UI/ui/packages/adapters/vue'

# 依赖目录（单一版本事实源）：入口包与所有 @xihan/* 底层包用 catalog: 引用，升级只改这里一处
