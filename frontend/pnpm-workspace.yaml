  - '@xihan-ui/code-highlight@4.2.0'
  - '@xihan-ui/core@4.2.0'
  - '@xihan-ui/headless@4.2.0'
  - '@xihan-ui/motion@4.2.0'
  - '@xihan-ui/pointer@4.2.0'
  - '@xihan-ui/position@4.2.0'
  - '@xihan-ui/sound@4.2.0'
  - '@xihan-ui/styles@4.2.0'
  - '@xihan-ui/tokens@4.2.0'
  - '@xihan-ui/vue@4.2.0'
  - '@xihan-ui/viz@4.2.0'
  - '@iconify-json/lucide@1.2.139'
  - '@intlify/core-base@11.4.13'
  - '@intlify/devtools-types@11.4.13'
  - '@intlify/message-compiler@11.4.13'
  - '@intlify/shared@11.4.13'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - turbo@2.11.7
  - vue-i18n@11.4.13
  - '@typescript-eslint/eslint-plugin@8.71.2'
